image:
  repository: ghcr.io/jaguzaro/audit-service
  tag: v1.4.1

resources:
  requests:
    cpu: 15m
    memory: 160Mi
  limits:
    cpu: 400m
    memory: 384Mi

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app: audit-service
