image:
  repository: ghcr.io/jaguzaro/auth-api
  tag: v1.4.1

resources:
  requests:
    cpu: 15m
    memory: 128Mi
  limits:
    cpu: 400m
    memory: 320Mi

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app: auth-api
