apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: telemetria
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jaguzaro/Practicas-SA-B-202201395-gitops.git
    targetRevision: main
    path: observabilidad
  destination:
    server: https://kubernetes.default.svc
    namespace: observabilidad
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
